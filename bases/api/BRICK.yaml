name: api
type: base
namespace: factory.api
description: HTTP API entry point with REST and GraphQL adapters
mcp_enabled: true
features:
- rest_api
- graphql_api
- openapi_schema
- route_introspection
adapters:
- rest
- graphql
pip_packages:
- fastapi>=0.128.0
- mcp[cli]==2.1.1
- opentelemetry-api>=1.20.0
- pydantic>=2.0.0
- starlette>=0.40.0
- uvicorn>=0.40.0
