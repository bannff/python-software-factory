name: notification
type: component
namespace: factory.notification
description: Notification delivery and alert management with pluggable channel backends
mcp_enabled: true
features:
- notifications
- alerts
- messaging
- email_smtp
- sms_twilio
- slack_webhooks
- templates
- inbox
- deep_link_resolution
adapters:
- stdio
- apprise
- celery
- aws
