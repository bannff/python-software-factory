name: machine_learning
type: component
namespace: factory.machine_learning
description: ML experiment tracking, fine-tuning job management, and model registry
mcp_enabled: true
dependencies:
- dataset
features:
- experiment_tracking
- run_management
- metrics_logging
- parameter_logging
- model_registry
- tensorboard_visualization
- mlflow_integration
- finetuning
- lora
- qlora
- model_export
- training_objectives
- checkpoint_lifecycle
- local_storage
- can_warm_inference
- model_passports
- attempt_idempotent_can_lifecycle
- polymorphic_native_can_lifecycle
- crash_reconciled_native_can_effects
- timegan_generation
- timegan_conditional_generation
- training_run_dashboard
- ml_observatory
adapters:
- memory
- mlflow
- tensorboard
- memory_finetuning
- mlx_finetuning
- peft_finetuning
- aws
- sklearn_timeseries
- torch_timeseries
- mlx_timeseries
- patchtst_timeseries
- chronos_timeseries
- lnn_timeseries
- timegan
- timegan_conditional
- can_inference
- local_model_passport_store
- training_run_store
mcp_resources:
- tracking://experiments
- tracking://experiments/{experiment_id}
- tracking://health
- tracking://jobs
- tracking://docs
mcp_prompts:
- run_experiment
- create_finetuning_job
- debug_finetuning_job
pip_packages:
- boto3>=1.35.0
- mcp[cli]==2.1.1
- joblib>=1.3.0
- lightgbm==4.7.0
- mlflow==3.16.0
- mlx==0.31.1; platform_system == "Darwin" and platform_machine == "arm64"
- mlx-lm==0.31.2; platform_system == "Darwin" and platform_machine == "arm64"
- numpy>=1.24.0
- pandas>=2.0.0
- scikit-learn>=1.3.0
- tensorboard>=2.17.0
- torch==2.13.0
- peft==0.19.1
- chronos-forecasting==2.3.1
- ncps==1.0.1
- transformers==5.5.4
