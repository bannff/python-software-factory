name: llm_gateway
type: component
namespace: factory.llm_gateway
description: Direct LLM calls with pluggable providers for completions and embeddings
mcp_enabled: true
features:
- text_completion
- chat_completion
- embeddings
- mcp_resources
- mcp_prompts
- native_mcp_v2_typed_pydantic_contracts
adapters:
- bedrock
- openai
- anthropic
- ollama
mcp_tools:
- get_capabilities
- health_check
- describe_config_schema
- llm_list_backends
- llm_complete
- llm_chat
- llm_embed
mcp_resources:
- llm://schemas/config
- llm://schemas/message
- llm://schemas/response
- llm://docs
- llm://docs/{doc_name}
- llm://backends
- llm://health
- llm://factory
mcp_prompts:
- configure_backend
- debug_llm
- optimize_prompts
pip_packages:
- anthropic>=0.34.0
- boto3>=1.35.0
- botocore>=1.34,<2
- mcp[cli]==2.1.1
- openai>=1.40.0
- pydantic>=2.0.0
