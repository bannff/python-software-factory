id: auto-telemetry-reward-on-metrics-record
event_type: "metrics.record"
handler: "mcp:telemetry_reward_dispatch"
description: >
  Turn a run's tool error rate into a negative (penalized) reward through the learning telemetry source and emit reward.computed, so process failures become a cautionary learning. Kept separate from the ground-truth findings reward: it rides metrics.record, not graph.completed.
enabled: true
priority: 2
filters: {}
