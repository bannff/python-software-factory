id: auto-generic-score-dispatch
event_type: "*.completed"
handler: "mcp:generic_score_dispatch"
description: >
  Policy-driven, domain-agnostic scoring. Routes any completed event through the scoring policy; events the policy does not match are skipped. The dedicated chat reward and chat feedback handlers have higher priority and run first; policy entries for those events are disabled by default to avoid double-scoring.
enabled: true
priority: 0
filters: {}
