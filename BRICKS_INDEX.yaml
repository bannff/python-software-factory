schema_version: 1
workspace: python-factory
bricks:
  components:
  - name: agent
    type: component
    namespace: factory.agent
    description: LangChain and LangGraph runtime for registered personas and scoped MCP capabilities
    mcp_enabled: true
    features:
    - agent_orchestration
    - bounded_langgraph_execution
    - graph_workflows
    - job_management
    - langchain_integration
    - langgraph_integration
    - polymorphic_design
    - persistent_chat_agent
    - companion_x_chat
    - mcp_resources
    - mcp_prompts
    - native_mcp_v2_scoped_capabilities
    - normalized_runtime_events
    - companion_x_registry_persona
    pip_packages:
    - boto3>=1.35.0
    - botocore>=1.34,<2
    - click>=8.0.0
    - fastapi>=0.128.0
    - langchain==1.3.17
    - langchain-aws==1.7.4
    - langchain-openai==1.6.2
    - langchain-community>=0.4,<0.5
    - langchain-experimental>=0.4,<0.5
    - langgraph==1.2.11
    - langgraph-checkpoint-sqlite==3.1.1
    - ddgs>=6.0.0
    - mcp[cli]==2.1.1
    - pydantic>=2.0.0
    - pyyaml>=6.0.0
    - uvicorn>=0.40.0
  - name: arcade_config
    type: component
    namespace: factory.arcade_config
    description: System/emulator/core configuration model for OpenArcade
    mcp_enabled: false
    features:
    - system_config
    - core_mapping
    pip_packages:
    - pydantic>=2.0.0
  - name: artifacts
    type: component
    namespace: factory.artifacts
    description: Tenant-owned versioned artifact library with stable slugs and immutable history
    mcp_enabled: true
    features:
    - stable_owner_scoped_slugs
    - idempotent_save
    - immutable_version_snapshots
    - revision_fenced_lifecycle
    - additive_version_revert
    - opaque_tombstones
    - content_free_lifecycle_events
    - bounded_owner_scoped_folders
    - one_level_comment_threads
    - human_gated_authoring
    - native_mcp_v2_typed_pydantic_contracts
    adapters:
    - sqlite
    mcp_resources: []
    mcp_prompts: []
    pip_packages:
    - mcp[cli]==2.1.1
    - pydantic>=2.0.0
  - name: auth
    type: component
    namespace: factory.auth
    description: Authentication and authorization via Keycloak with token verification, exchange, and
      native MCP v2 typed Pydantic contracts
    mcp_enabled: true
    features:
    - authentication
    - authorization
    - token_management
    - keycloak_integration
    - token_exchange
    - multitenancy
    - tokenless_credential_egress
    - oauth_authorization_code_enrollment
    - native_mcp_v2_typed_pydantic_contracts
    adapters:
    - memory
    - keycloak
    - authlib_keycloak
    - aws
    adapter_infra:
      keycloak:
        services:
        - keycloak
      authlib_keycloak:
        services:
        - keycloak
      aws:
        services: []
    pip_packages:
    - authlib>=1.3.0
    - boto3>=1.35.0
    - mcp[cli]==2.1.1
    - httpx>=0.27.0
    - pydantic>=2.0.0
    - pyjwt[crypto]>=2.8.0
    - pyyaml>=6.0.0
    - typer>=0.12.0
  - name: blockchain
    type: component
    namespace: factory.blockchain
    description: Agent economy ledger with wallets, transfers, bounties, and a strict typed MCP boundary
    mcp_enabled: true
    features:
    - agent_economy
    - wallets
    - transfers
    - bounties
    - hash_chain
    - merkle_trees
    - mcp_resources
    - mcp_prompts
    - native_mcp_v2_typed_pydantic_contracts
    - authoring_gate
    - mcp_views
    pip_packages:
    - mcp[cli]==2.1.1
    - pydantic>=2.0.0
  - name: browser
    type: component
    namespace: factory.browser
    description: Browser automation with pluggable protocol adapters (CDP, Playwright, Selenium). Its
      18 public native MCP v2 tools retain their names and flat kwargs, validate ingress with strict same-brick
      Pydantic v2 DTOs, and return ToolResult v1 envelopes.
    mcp_enabled: true
    features:
    - native_mcp_v2_typed_pydantic_contracts
    - browser_automation
    - page_navigation
    - element_interaction
    - screenshot_capture
    - network_interception
    - javascript_execution
    - cdp_protocol
    adapters:
    - cdp
    - mock
    mcp_resources:
    - browser://schemas/config
    - browser://schemas/session
    - browser://docs
    - browser://docs/{doc_name}
    - browser://sessions
    - browser://backends
    - browser://health
    - browser://factory
    mcp_prompts:
    - automate_page
    - extract_content
    - debug_session
    pip_packages:
    - mcp[cli]==2.1.1
    - httpx>=0.27.0
    - pydantic>=2.0.0
    - pyyaml>=6.0.0
    - websockets>=12.0
  - name: cache
    type: component
    namespace: factory.cache
    description: Ephemeral caching with pluggable backends (memory, Redis)
    mcp_enabled: true
    features:
    - key_value_cache
    - ttl_support
    - pattern_matching
    - statistics
    adapters:
    - memory
    - redis
    - aws
    adapter_infra:
      redis:
        services:
        - redis
      aws:
        services: []
    mcp_resources:
    - cache://schemas/config
    - cache://schemas/entry
    - cache://schemas/stats
    - cache://docs
    - cache://docs/{doc_name}
    - cache://stats
    - cache://backends
    - cache://health
    - cache://factory
    mcp_prompts:
    - configure_cache
    - debug_cache
    - optimize_cache
    pip_packages:
    - boto3>=1.35.0
    - mcp[cli]==2.1.1
    - redis>=7.1.0
  - name: config
    type: component
    namespace: factory.config
    description: Centralized configuration with pluggable backends (env, file, SSM)
    mcp_enabled: true
    features:
