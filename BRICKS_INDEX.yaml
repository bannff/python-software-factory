    - migrate_config
    pip_packages:
    - boto3>=1.35.0
    - mcp[cli]==2.1.1
    - pydantic-settings>=2.12.0
    - pydantic>=2.0.0
    - pyyaml>=6.0.0
  - name: connections
    type: component
    namespace: factory.connections
    description: Owner-registered external MCP servers (stdio or Streamable HTTP) mounted as gateway powers
    mcp_enabled: true
