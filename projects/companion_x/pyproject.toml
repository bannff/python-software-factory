[build-system]
requires = ["hatchling", "hatch-polylith-bricks"]
build-backend = "hatchling.build"

[project]
name = "companion_x"
version = "0.1.0"
description = "Companion-X recreated as a factory project — agentic security platform with full brick coverage"
requires-python = ">=3.11"

dependencies = [
    # --- Core runtime (always needed) ---
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "blinker>=1.9.0",
    "boto3>=1.35.0",
    "click>=8.0.0",
    "croniter==6.2.4",
    "cryptography>=49.0.0",
    "fastapi>=0.128.0",
    "mcp[cli]==2.1.1",
    "langchain==1.3.17",
    "langchain-aws==1.7.4",
    "langchain-openai==1.6.2",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    # Dataset-backed CAN keystone runtime (bd:python-factory-p9jgi).
    "asammdf>=8.0.0",
    "cantools>=42.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "sdv>=1.37.0",
    # machine_learning brick timeseries training path (bd:python-factory-ytogx):
    # sklearn adapter imports joblib+sklearn at module level, lightgbm at train.
    "joblib>=1.3.0",
    "lightgbm==4.7.0",
    "mlflow==3.16.0",
    "mlx==0.31.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "chronos-forecasting==2.3.1",
    "ncps==1.0.1",
    "peft==0.19.1",
    "scikit-learn>=1.3.0",
    "torch==2.13.0",
    "transformers==5.10.1",
    "neo4j>=6.1.0",
    "neo4j-graphrag>=1.0.0",
    "networkx>=3.6.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-instrumentation==0.62b0",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.0.0",
    "pyjwt[crypto]>=2.8.0",
    "pyyaml>=6.0.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.0.0",
    "structlog>=25.1.0",
    "tenacity>=8.2.0",
    "typer>=0.12.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
# Adapter-specific deps — install with: pip install companion_x[chromadb,celery,...]
chromadb = ["chromadb>=1.4.1"]
dagster = ["dagster>=1.7.0"]
celery = ["celery>=5.6.2"]
flet = ["flet>=0.27.0"]
postgres = ["psycopg2-binary>=2.9.9"]
mongodb = ["pymongo>=4.8.0"]
zep = ["zep-cloud>=2.0.0"]
anthropic = ["anthropic>=0.34.0"]
apprise = ["apprise>=1.9.0"]
cedar = ["cedarpy>=0.4.0"]
keycloak = ["authlib>=1.3.0"]
graphql = ["gql[httpx]>=3.5.0"]
browser-cdp = ["websockets>=12.0"]
tinydb = ["tinydb>=4.8.2"]
# All optional adapters at once
all = [
    "anthropic>=0.34.0",
    "apprise>=1.9.0",
    "authlib>=1.3.0",
    "cedarpy>=0.4.0",
    "celery>=5.6.2",
    "chromadb>=1.4.1",
    "dagster>=1.7.0",
    "flet>=0.27.0",
    "gql[httpx]>=3.5.0",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.8.0",
    "tinydb>=4.8.2",
    "websockets>=12.0",
    "zep-cloud>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["factory"]

[tool.hatch.build]
# Hatchling-native editable-mode escape hatch (bd:python-factory-9wcd).
# See workspace pyproject.toml for the full rationale. Paths are
# project-relative (this file lives in projects/companion_x/), so
# dev-mode-dirs use ../../ to point back at the workspace bricks.
# Keep parity with [tool.polylith.bricks] keys below.
dev-mode-dirs = [
    "../../bases/api/src",
    "../../bases/blueprint/src",
    "../../bases/mcp_server/src",
    "../../bases/worker/src",
    "../../components/agent/src",
    "../../components/artifacts/src",
    "../../components/auth/src",
    "../../components/blockchain/src",
    "../../components/browser/src",
    "../../components/cache/src",
    "../../components/config/src",
    "../../components/dataset/src",
    "../../components/devtools/src",
    "../../components/evals/src",
    "../../components/events/src",
    "../../components/games/src",
    "../../components/graph/src",
    "../../components/http_client/src",
    "../../components/integrations/src",
    "../../components/kb/src",
    "../../components/learning/src",
    "../../components/lessons/src",
    "../../components/llm_gateway/src",
    "../../components/logger/src",
    "../../components/machine_learning/src",
    "../../components/mcp_utils/src",
    "../../components/memory/src",
    "../../components/migration/src",
    "../../components/metrics/src",
    "../../components/notification/src",
    "../../components/payments/src",
    "../../components/permissions/src",
    "../../components/portability/src",
    "../../components/sandbox/src",
    "../../components/scheduler/src",
    "../../components/connections/src",
    "../../components/security/src",
    "../../components/session/src",
    "../../components/storage/src",
    "../../components/telemetry/src",
    "../../components/terminal/src",
    "../../components/test/src",
    "../../components/ui/src",
    "../../components/workflow/src",
]

[tool.hatch.build.hooks.polylith-bricks]

[tool.polylith.bricks]
    "../../components/agent/src/factory/agent" = "factory/agent"
    "../../components/artifacts/src/factory/artifacts" = "factory/artifacts"
    "../../bases/api/src/factory/api" = "factory/api"
    "../../components/auth/src/factory/auth" = "factory/auth"
    "../../components/blockchain/src/factory/blockchain" = "factory/blockchain"
    "../../bases/blueprint/src/factory/blueprint" = "factory/blueprint"
    "../../components/browser/src/factory/browser" = "factory/browser"
    "../../components/cache/src/factory/cache" = "factory/cache"
    "../../components/config/src/factory/config" = "factory/config"
    "../../components/dataset/src/factory/dataset" = "factory/dataset"
    "../../components/devtools/src/factory/devtools" = "factory/devtools"
    "../../components/evals/src/factory/evals" = "factory/evals"
    "../../components/games/src/factory/games" = "factory/games"
    "../../components/events/src/factory/events" = "factory/events"
    "../../components/graph/src/factory/graph" = "factory/graph"
    "../../components/http_client/src/factory/http" = "factory/http"
