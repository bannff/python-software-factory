name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature] "
labels: ["type/feature", "status/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: Describe the problem or use case...
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this feature accomplish?
      placeholder: Describe the desired outcome...
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed Approach
      description: How would you implement this?
      placeholder: Describe your suggested implementation...
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope?
      placeholder: |
        In scope:
        - 
        
        Out of scope:
        - 
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know when this is complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: brick
    attributes:
      label: Which brick category?
      options:
        - Component
        - Base
        - Project
        - Workspace/Infrastructure
    validations:
      required: true
